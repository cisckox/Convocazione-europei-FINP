name: Monitor Convocati Paralimpici

on:
  workflow_dispatch:
  repository_dispatch:
    types: [cron-job]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ripristina hash precedente
        uses: actions/cache@v4
        with:
          path: last_hash.txt
          key: page-hash-${{ github.run_id }}
          restore-keys: page-hash-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Controlla la pagina
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          TWILIO_WHATSAPP_TO: ${{ secrets.TWILIO_WHATSAPP_TO }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PREV_HASH: ${{ secrets.PREV_HASH }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python monitor.py
